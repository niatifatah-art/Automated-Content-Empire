[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ace"
version = "2.0.1"
description = "Automated Content Empire — cloud-first evidence-aware content production"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Fatah Niati" }]
license = { text = "MIT" }
keywords = ["content", "automation", "video", "gemini", "social-media", "evidence", "ffmpeg"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "PyYAML>=6.0",
  "Pillow>=10.0",
]

[project.optional-dependencies]
voice = [
  "kokoro>=0.9.4; python_version < '3.13'",
  "numpy>=1.26",
  "soundfile>=0.12",
]
browser = ["playwright>=1.45"]
alignment = ["faster-whisper>=1.0"]
test = ["pytest>=8", "build>=1.2"]
all = [
  "kokoro>=0.9.4; python_version < '3.13'",
  "numpy>=1.26",
  "soundfile>=0.12",
  "playwright>=1.45",
]

[project.scripts]
ace = "ace.main:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ace.data" = ["*.json", "*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
