schema_version: 2
name: Demo Creator
slug: demo-creator
description: >
  A generic example account used to demonstrate ACE configuration without
  exposing a real creator identity, handle, voice, or publishing profile.
identity:
  personality:
    - human
    - clear
    - credible
  age_energy: general
  humor:
    default_level: moderate
    allow_light_cringe: false
    allow_memes: true
    avoid_forced_jokes: true
    avoid_mocking_victims: true
audience:
  description: General technology audience
  knowledge_level: general
  age_range: broad
languages:
  primary: en
  enabled: [en, ar, fr]
platforms:
  youtube: {enabled: true}
  tiktok: {enabled: true}
  instagram: {enabled: true}
content:
  pillars: [technology, education]
  avoid:
    - fake urgency
    - unsupported statistics
voice:
  configured: false
  # Future Speech Core binding. A stable profile ID identifies the account voice;
  # engine/model/recipe details stay inside Speech Core instead of ACE account data.
  profile_id: null
  policy: consistency_first
  default_style: creator
  # Legacy compatibility fields remain until ACE voice.py migrates to Speech Core.
  provider: kokoro
  voice_id: af_sarah
  pace: natural
  energy: conversational
editing:
  style: adaptive
  default_mood: technical_dynamic
  audience_mentality: general
  captions: {mode: director, maximum_lines: 2}
  humor: {adaptive: true, controlled_cringe: false}
automation:
  candidates: 5
  minimum_quality_score: 85
  maximum_retries: 2
