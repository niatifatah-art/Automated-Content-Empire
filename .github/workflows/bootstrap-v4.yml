name: Bootstrap ACE V4 source

on:
  push:
    branches:
      - feature/v4-adaptive-asset-first

permissions:
  contents: write

jobs:
  unpack:
    if: ${{ hashFiles('ACE-V4-alpha1-source.zip') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand verified source archive
        run: |
          set -euo pipefail
          unzip -q ACE-V4-alpha1-source.zip -d .
          rm ACE-V4-alpha1-source.zip

      - name: Commit expanded source tree
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: expand ACE V4 alpha source"
          git push
